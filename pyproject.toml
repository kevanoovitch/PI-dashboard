[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project]
name = "PI-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "blinker==1.9.0",
    "click==8.3.1",
    "flask==3.1.3",
    "iniconfig==2.3.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "packaging==26.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "pytest==9.0.2",
    "ruff==0.15.7",
    "werkzeug==3.1.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]